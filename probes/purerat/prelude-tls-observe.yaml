# Optional observation of the same reviewed compatibility hypothesis, not a family detector.
parameters:
  purerat.tirakian_ip: { type: ip, required: true }
  purerat.acknowledge_profile:
    type: token
    required: true
    allowed_values: [purerat-e554-tirakian-legacy-prelude]
dsl_version: 1
name: purerat-prelude-tls-observation
metadata:
  family: purehvnc
  protocol: purerat_legacy_prelude_hypothesis
  plan_order: 200
  description: Scoped optional TLS observation after the unverified e554 legacy prelude; never identifies the family.
scope: { ips: ["${purerat.tirakian_ip}"], ports: [56001, 56002, 56003] }
transport: { type: starttls, prelude_hex: "04 00 00 00", connect_timeout_ms: 1000, read_timeout_ms: 1000, insecure_tls: true }
steps:
  - peer_certificate: { save_as: certificate_sha256 }
  - extract: { source: certificate_sha256, name: certificate_size, type: bufferlen, offset: 0 }
  - match: { eq: { left: "$certificate_size", right: 32 } }
result:
  family: unclassified
  protocol: purerat_legacy_prelude_hypothesis
  classification: observation
  confidence: 0.35
  status: purerat_prelude_tls_observed
  unmatched_status: purerat_prelude_tls_not_observed
  fields: { variant: managed_purerat_4_4_1_legacy_prelude_hypothesis, compatibility_hypothesis: true, reviewed_host: tirakian.com, reviewed_ip: "${purerat.tirakian_ip}", wire_prelude_verified_for_sample: false, prelude_hex: "04000000", certificate_sha256: "$hex:certificate_sha256", certificate_mismatch_excludes_c2: false, victim_metadata_sent: false, application_data_sent: true, plaintext_prelude_sent: true, sent_bytes: 4, tls_version_enforced: false }

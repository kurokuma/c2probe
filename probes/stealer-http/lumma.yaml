parameters:
  stealer.uid: { type: hex, required: true, min_length: 32, max_length: 64 }
  stealer.cid: { type: token, default: "" }
dsl_version: 1
name: lumma-v6-http-uid-registration
metadata:
  family: lummastealer
  protocol: http_uid_registration
  plan_order: 401
  description: Send a supplied synthetic UID and classify only the bounded registration response shape as probable.
transport: { type: tcp, connect_timeout_ms: 1000, read_timeout_ms: 3000 }
steps:
  - literal: { name: request_body, text: "uid=${stealer.uid}&cid=${stealer.cid}" }
  - send_http:
      method: POST
      path: /
      headers: { Host: "$target_ip", Content-Type: application/x-www-form-urlencoded, User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/109.0.5414.120", Connection: close }
      body_source: request_body
  - recv_http: { max_header_bytes: 4096, max_body_bytes: 65536, body_as: response_body, header_as: header, status_as: http_status, content_length_as: response_size }
  - extract: { source: response_body, name: actual_size, type: bufferlen, offset: 0 }
  - match:
      all:
        - any: [{ eq: { left: "$http_status", right: 200 } }, { eq: { left: "$http_status", right: 201 } }]
        - gt: { left: "$actual_size", right: 0 }
        - not: { bytes_regex: { source: response_body, pattern: "(?s)^\\s*<" } }
        - any:
            - not: { bytes_regex: { source: header, pattern: "(?i)\\r\\ncontent-type:" } }
            - bytes_regex: { source: header, pattern: "(?i)\\r\\ncontent-type:[ \\t]*(?:application/json|application/octet-stream|text/plain)" }
result:
  family: lummastealer
  protocol: http_uid_registration
  classification: probable
  confidence: 0.78
  unmatched_confidence: 0.35
  status: lumma_registration_shape_match
  unmatched_status: lumma_registration_mismatch
  fields: { http_status: "$http_status", response_size: "$actual_size", synthetic_identity_sent: true, victim_metadata_sent: false, response_body_published: false, payload_download_attempted: false }

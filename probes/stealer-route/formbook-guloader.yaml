parameters:
  formbook.expected_ip: { type: ip, required: true }
dsl_version: 1
name: formbook-guloader-3f79-bootstrap-route-v1
metadata: { family: formbook, protocol: reviewed_http_route_observation, plan_order: 500, description: Reviewed FormBook bootstrap route plus a negative-control route. }
scope: { ips: ["${formbook.expected_ip}"], ports: [80] }
transport: { type: tcp, connect_timeout_ms: 1000, read_timeout_ms: 3000 }
steps:
  - send_http: { method: HEAD, path: /ximu/, headers: { Host: www.plantaonewsms.com.br, User-Agent: "Mozilla/5.0 (Linux; U; Android 4.1.2; en-us; Xoom Build/JZO54M) AppleWebKit/534.30 (KHTML, like Gecko) Version/4.0 Safari/534.30", Accept: "*/*", Connection: close } }
  - recv_http: { max_header_bytes: 4096, max_body_bytes: 0, headers_only: true, body_as: route_body, header_as: route_header, status_as: route_status, content_length_as: route_length }
  - reconnect: {}
  - send_http: { method: HEAD, path: /.well-known/asa-reviewed-route-negative-control-7f6d9e2b, headers: { Host: www.plantaonewsms.com.br, User-Agent: "Mozilla/5.0 (Linux; U; Android 4.1.2; en-us; Xoom Build/JZO54M) AppleWebKit/534.30 (KHTML, like Gecko) Version/4.0 Safari/534.30", Accept: "*/*", Connection: close } }
  - recv_http: { max_header_bytes: 4096, max_body_bytes: 0, headers_only: true, body_as: control_body, header_as: control_header, status_as: control_status, content_length_as: control_length }
  - match:
      all:
        - any: [{ eq: { left: "$route_status", right: 200 } }, { eq: { left: "$route_status", right: 204 } }, { eq: { left: "$route_status", right: 401 } }, { eq: { left: "$route_status", right: 403 } }, { eq: { left: "$route_status", right: 405 } }]
        - any: [{ eq: { left: "$control_status", right: 400 } }, { eq: { left: "$control_status", right: 404 } }, { eq: { left: "$control_status", right: 410 } }]
result:
  family: formbook
  protocol: reviewed_http_route_observation
  classification: probable
  confidence: 0.60
  status: formbook_reviewed_route_pair_match
  unmatched_status: formbook_reviewed_route_pair_mismatch
  fields: { route_status: "$route_status", control_status: "$control_status", request_body_sent: false, victim_metadata_sent: false }

scope: { ips: ["${vidar.expected_ip}"], ports: [443] }
transport: { type: tls, server_name: "195.201.45.175", connect_timeout_ms: 1000, read_timeout_ms: 3000, insecure_tls: true }
steps:
  - send_http: { method: HEAD, path: /, headers: { Host: "195.201.45.175", User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win32) AppleWebKit/537.36 (KHTML, like Gecko) Edg/147.0.0.0", Accept: "*/*", Connection: close } }
  - recv_http: { max_header_bytes: 4096, max_body_bytes: 0, headers_only: true, body_as: route_body, header_as: route_header, status_as: route_status, content_length_as: route_length }
  - reconnect: {}
